<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- 底部深色立体阴影基座 -->
  <rect x="11" y="11" width="80" height="80" rx="22" fill="#181E29" />
  
  <!-- 前景绿色卡片（顶部和左侧为细边框） -->
  <rect x="5" y="5" width="80" height="80" rx="22" fill="#13AC53" stroke="#181E29" stroke-width="3" stroke-linejoin="round" />
  
  <!-- 字母 P（高度已缩短，保持比例协调） -->
  <path d="M 28 34 V 56" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" />
  <path d="M 28 34 H 36 C 42 34 42 45 36 45 H 28" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 字母 V（高度已缩短） -->
  <path d="M 48.5 34 L 57 56 L 65.5 34" fill="none" stroke="#FFFFFF" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
